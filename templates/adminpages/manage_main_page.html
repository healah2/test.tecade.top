{% extends 'clientside/base.html' %}
{% load static %}


{% block extra_styles %}
<!-- Google Web Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
    rel="stylesheet">

<!-- Icon Font Stylesheet -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- Libraries Stylesheet -->
<link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">
<link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet">

<!-- Customized Bootstrap Stylesheet -->
<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

<!-- Template Stylesheet -->
<link href="{% static 'css/style.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
    <div class="row py-5">
        <div class="col-12 pt-lg-5 mt-lg-5 text-center">
            <h1 class="display-4 text-white animated zoomIn">Manage</h1>
            <h1 class="display-4 text-white animated zoomIn">Main Page</h1>
        </div>
    </div>
</div>
</div>
<!-- Navbar & Carousel End -->


<div
    style="max-width: 1000px; margin: auto; background-color: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1);">

    <h2 style="text-align: center; color: navy; margin-bottom: 30px;">Manage Main Page Content</h2>
    <hr style="border: 1px solid peru; margin-bottom: 30px;">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- META / HEAD -->
        <h4>Meta / Head</h4>
        <label>Site Title</label>
        <input type="text" name="site_title" value="{{ mainpage.site_title }}" class="form-control mb-3">

        <label>Favicon</label>
        <input type="file" name="favicon" class="form-control mb-3">

        <!-- TOPBAR -->
        <h4>Topbar</h4>
        <label>Location</label>
        <input type="text" name="topbar_location" value="{{ mainpage.topbar_location }}" class="form-control mb-2">
        <label>Phone</label>
        <input type="text" name="topbar_phone" value="{{ mainpage.topbar_phone }}" class="form-control mb-2">
        <label>Email</label>
        <input type="email" name="topbar_email" value="{{ mainpage.topbar_email }}" class="form-control mb-2">

        <label>Twitter URL</label>
        <input type="url" name="topbar_twitter" value="{{ mainpage.topbar_twitter }}" class="form-control mb-2">
        <label>Facebook URL</label>
        <input type="url" name="topbar_facebook" value="{{ mainpage.topbar_facebook }}" class="form-control mb-2">
        <label>LinkedIn URL</label>
        <input type="url" name="topbar_linkedin" value="{{ mainpage.topbar_linkedin }}" class="form-control mb-2">
        <label>Instagram URL</label>
        <input type="url" name="topbar_instagram" value="{{ mainpage.topbar_instagram }}" class="form-control mb-2">
        <label>YouTube URL</label>
        <input type="url" name="topbar_youtube" value="{{ mainpage.topbar_youtube }}" class="form-control mb-3">

        <!-- NAVBAR -->
        <h4>Navbar</h4>
        <label>Institution Name</label>
        <input type="text" name="institution_name" value="{{ mainpage.institution_name }}" class="form-control mb-2">
        <label>Logo</label>
        <input type="file" name="nav_logo" class="form-control mb-3">

        <!-- FOOTER -->
        <h4>Footer</h4>
        <label>Location</label>
        <input type="text" name="footer_location" value="{{ mainpage.footer_location }}" class="form-control mb-2">
        <label>Phone</label>
        <input type="text" name="footer_phone" value="{{ mainpage.footer_phone }}" class="form-control mb-2">
        <label>Email</label>
        <input type="email" name="footer_email" value="{{ mainpage.footer_email }}" class="form-control mb-2">

        <label>Twitter URL</label>
        <input type="url" name="footer_twitter" value="{{ mainpage.footer_twitter }}" class="form-control mb-2">
        <label>Facebook URL</label>
        <input type="url" name="footer_facebook" value="{{ mainpage.footer_facebook }}" class="form-control mb-2">
        <label>LinkedIn URL</label>
        <input type="url" name="footer_linkedin" value="{{ mainpage.footer_linkedin }}" class="form-control mb-2">
        <label>Instagram URL</label>
        <input type="url" name="footer_instagram" value="{{ mainpage.footer_instagram }}" class="form-control mb-2">
        <label>YouTube URL</label>
        <input type="url" name="footer_youtube" value="{{ mainpage.footer_youtube }}" class="form-control mb-3">

        <!-- FOOTER ABOUT -->
        <h4>Footer About</h4>
        <label>Title</label>
        <input type="text" name="footer_about_title" value="{{ mainpage.footer_about_title }}" class="form-control mb-2">
        <label>Description</label>
        <textarea name="footer_about_desc" class="form-control mb-2">{{ mainpage.footer_about_desc }}</textarea>
        <label>Logo</label>
        <input type="file" name="footer_about_logo" class="form-control mb-3">

        <button type="submit" class="btn btn-primary w-100">Save Main Page</button>
    </form>


    

    
    




</div>
</div>
{% endblock content %}

{% block extra_scripts %}
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'lib/wow/wow.min.js' %}"></script>
<script src="{% static 'lib/easing/easing.min.js' %}"></script>
<script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
<script src="{% static 'lib/counterup/counterup.min.js' %}"></script>
<script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>

<!-- Template Javascript -->
<script src="{% static 'js/main.js' %}"></script>

{% endblock %}
