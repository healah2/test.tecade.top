<!-- templates/update-contact.html -->
{% extends 'main.html' %}
{% block content %}

<section class="section">
  <div class="container">
    <h2 class="mb-4">Update Contact Information</h2>

    {% if success %}
      <div class="alert alert-success">Contact info updated successfully!</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" name="address" id="address" value="{{ contact.address }}">
      </div>

      <div class="mb-3">
        <label for="contact_number" class="form-label">Contact Number</label>
        <input type="text" class="form-control" name="contact_number" id="contact_number" value="{{ contact.contact_number }}">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" name="email" id="email" value="{{ contact.email }}">
      </div>

      <div class="mb-3">
        <small class="form-text text-muted">Include full international format, e.g. +254712345678</small>
        <label for="whatsapp_number" class="form-label">WhatsApp Number</label>
        <input type="text" class="form-control" name="whatsapp_number" id="whatsapp_number" value="{{ contact.whatsapp_number }}">
      </div>

      <button type="submit" class="btn btn-primary">Update</button>
    </form>
  </div>
</section>

{% endblock %}
