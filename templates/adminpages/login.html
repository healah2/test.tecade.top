<!DOCTYPE html>
<html>
{% load static %}

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>ssy.oayouthkenya | Log in</title>
  <!-- Tell the browser to be responsive to screen width -->
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <!-- Bootstrap 3.3.7 -->
  <link rel="stylesheet" href="{% static 'homefiles/bower_components/jquery/dist/jquery.min.js' %}">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'homefiles/bower_components/font-awesome/css/font-awesome.min.css' %}">
  <!-- Ionicons -->
  <link rel="stylesheet" href="{% static 'homefiles/bower_components/Ionicons/css/ionicons.min.css' %}">
  <!-- Form style -->
  <link rel="stylesheet" href="{% static 'homefiles/bower_components/bootstrap/dist/css/bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'homefiles/dist/css/AdminLTE.min.css' %}">
  <!-- iCheck -->
  <link rel="stylesheet" href="{% static 'homefiles/plugins/iCheck/square/blue.css' %}">

  <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
  <!--[if lt IE 9]>
  <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
  <![endif]-->

  <!-- Google Font -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">

  <style>
    /* Make the input fields have a green border */
    .form-control {
      border: 2px solid #228B22 !important;
      /* Dark green border */
      background-color: #E6F4EA !important;
      /* Light green background */
      color: #155724 !important;
      /* Dark green text */
    }

    /* Make the input placeholders green */
    .form-control::placeholder {
      color: #155724 !important;
    }

    /* Change the checkbox color */
    .icheckbox_square-blue,
    .iradio_square-blue {
      background-color: #228B22 !important;
      /* Green background */
      border-color: #228B22 !important;
    }

    /* Change the submit button to green */
    .btn-primary {
      background-color: #228B22 !important;
      border-color: #1E7E34 !important;
    }

    .btn-primary:hover {
      background-color: #1E7E34 !important;
    }

    /* Change the links to green */
    a {
      color: #228B22 !important;
    }

    a:hover {
      color: #1E7E34 !important;
    }
  </style>


</head>

<body class="hold-transition login-page">
  <div class="login-box">
    <div class="login-logo">
      <a href="/"><b>Nairo</b>green</a>
    </div>
    <!-- /.login-logo -->
    <div class="login-box-body">
      <p class="login-box-msg">Sign in to use the service</p>

      <!-- Display error messages if there are any -->
      {% if messages %}
      <div class="alert alert-warning">
        {% for message in messages %}
        <h5>{{ message }}</h5>
        {% endfor %}
      </div>
      {% endif %}

      <form action="/login/" method="post">
        {% csrf_token %}
        <div class="form-group has-feedback">
          <input type="email" class="form-control" placeholder="Email" name="userEmail" required>
          <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
        </div>
        <div class="form-group has-feedback">
          <input type="password" class="form-control" placeholder="Password" name="userPassword" required>
          <span class="glyphicon glyphicon-lock form-control-feedback"></span>
        </div>
        <div class="row">
          <div class="col-xs-8">
            <div class="checkbox icheck">
              <label>
                <input type="checkbox"> Remember Me
              </label>
            </div>
          </div>
          <!-- /.col -->
          <div class="col-xs-4">
            <button type="submit" class="btn btn-primary btn-block btn-flat">Sign In</button>
          </div>
          <!-- /.col -->
        </div>
      </form>

      <a href="/password-reset/">I forgot my password</a><br>
      <a href="/register/" class="text-center">Register a new membership</a>

    </div>
    <!-- /.login-box-body -->
  </div>
  <!-- /.login-box -->

  <!-- jQuery 3 -->
  <script src="{% static 'homefiles/bower_components/jquery/dist/jquery.min.js' %}"></script>
  <!-- Bootstrap 3.3.7 -->
  <script src="{% static 'homefiles/bower_components/bootstrap/dist/js/bootstrap.min.js' %}"></script>
  <!-- iCheck -->
  <script src="{% static 'homefiles/plugins/iCheck/icheck.min.js' %}"></script>
  <script>
    $(function () {
      $('input').iCheck({
        checkboxClass: 'icheckbox_square-blue',
        radioClass: 'iradio_square-blue',
        increaseArea: '20%' // optional
      });
    });
  </script>

  <script>
    setTimeout(function () {
      const alerts = document.querySelectorAll('.alert');
      alerts.forEach(alert => alert.remove());
    }, 5000);  // 5000ms = 5 seconds
  </script>

</body>

</html>
