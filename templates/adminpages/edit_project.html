<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project: {{ project.projectTitle }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FAFAFA; /* Light Beige */
            margin: 0;
            padding: 0;
        }
        
        .container {
            width: 60%;
            margin: 50px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            color: #4CAF50; /* Forest Green */
            text-align: center;
            margin-bottom: 30px;
        }
        
        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            color: #333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
        }

        button {
            background-color: #FFA726; /* Sunset Orange */
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            align-self: flex-start;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #FF9800; /* Darker Sunset Orange on hover */
        }
        
        .form-group input:focus, .form-group textarea:focus {
            border-color: #4CAF50; /* Forest Green */
            outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Project: {{ project.projectTitle }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.projectTitle.label }}
            {{ form.projectTitle }}
        </div>
        <div class="form-group">
            {{ form.description.label }}
            {{ form.description }}
        </div>
        <div class="form-group">
            {{ form.lat.label }}
            {{ form.lat }}
        </div>
        <div class="form-group">
            {{ form.long.label }}
            {{ form.long }}
        </div>
        <button type="submit">Save Changes</button>
    </form>
</div>

</body>
</html>
