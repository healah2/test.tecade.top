<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Page Not Found</title>
  <style>
    /* Full-page layout */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #b4692d, #f4f4f4 0%, #f67f5e 30%, #d1b28d 70%);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .error-code {
      font-size: 8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-code div, .emoji {
      margin: 0 0.025em; /* Reduced spacing */
    }

    /* Emoji styling & animations */
    .emoji {
      display: inline-block;
      width: 1em;
      height: 1em;
      transform-origin: center;
      animation: pop 2s infinite ease-in-out, bounce 3s infinite ease;
    }

    /* Popping effect */
    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Bounce effect */
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* Eyes blinking (brief closure) */
    .eye { fill: #000; transform-origin: center; animation: blink 8s infinite; }
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      95%, 96% { transform: scaleY(0.1); }
    }

    .message {
      font-size: 1.5rem;
      margin: 1rem 0 2rem;
    }

    .home-btn {
      background-color: #da542f;
      color: #fff;
      padding: 0.8rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .home-btn:hover {
      background-color: #ca340b;
    }
  </style>
</head>
<body>

  <h1>Oops!<br>ERROR</h1>

  <div class="error-code">
    <div>4</div>
    <div class="emoji">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <circle cx="64" cy="64" r="60" fill="#eea74f" stroke="#000" stroke-width="4"/>
        <ellipse class="eye" cx="46" cy="50" rx="10" ry="14"/>
        <ellipse class="eye" cx="82" cy="50" rx="10" ry="14"/>
        <path d="M44,82 Q64,102 84,82" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div>4</div>
  </div>

  <div class="message">
    Sorry, page not found!<br/>
    The page you requested could not be located.
  </div>

  <a href="/" class="home-btn">Take Me Home</a>

</body>
</html>
